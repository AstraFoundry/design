name: Release

# Publishes @astrafoundry/design (packages/web) to GitHub Packages with
# `make publish`.
#   - Push a tag vX.Y.Z that matches packages/web/package.json to publish.
#   - Run it by hand (Actions → Release → Run workflow) for a dry run.
# Auth is the Actions GITHUB_TOKEN (packages: write) against
# https://npm.pkg.github.com. This workflow does not publish to npmjs and
# does not read NPM_TOKEN.
# The Go module is released by its own tag, packages/mygo/vX.Y.Z, which this
# workflow ignores.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # setup-node writes `//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}`.
    # The value is the job's GITHUB_TOKEN, not an npmjs token. Set it before
    # setup-node so that action does not export a placeholder.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@astrafoundry"
          cache: pnpm

      # make publish runs make check, which vets and tests the MyGo package too.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/mygo/go.mod
          cache-dependency-path: packages/mygo/go.sum

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package version
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./packages/web/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match packages/web/package.json version ${version}."
            exit 1
          fi

      - name: Publish to GitHub Packages
        if: github.event_name == 'push'
        run: make publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry run
        if: github.event_name == 'workflow_dispatch'
        run: make check && pnpm --filter @astrafoundry/design publish --dry-run --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
