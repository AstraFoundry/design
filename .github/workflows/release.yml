name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # make publish runs make check, which vets and tests the MyGo package too.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/mygo/go.mod
          cache-dependency-path: packages/mygo/go.sum

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        run: make publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
